name: Browser B1 verification
on:
  pull_request:
    branches: [main]
    paths: ['browser-emulator/**', 'reader-dependency/**', 'docs/browser-b1.md', 'package.json', '.github/workflows/browser-b1.yml']
  push:
    branches: [main, 'migration/**']
    paths: ['browser-emulator/**', 'reader-dependency/**', 'docs/browser-b1.md', 'package.json', '.github/workflows/browser-b1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
      - uses: actions/checkout@v4
        with:
          repository: melonDS-emu/melonDS
          ref: b86390e4428bf38ce4c1ce0e9ca446d6d25955e8
          path: work/research/melonds
          persist-credentials: false
      - name: Rebuild pinned WebAssembly core and refresh offline assets
        env:
          MELONDS_SOURCE: work/research/melonds
        run: |
          node browser-emulator/scripts/build-core.mjs
          node browser-emulator/scripts/prepare.mjs
      - name: Verify rebuilt WASM, parsers and offline assets in Chromium
        env:
          CHROMIUM_PATH: google-chrome
        run: node --test browser-emulator/tests/*.test.mjs
      - name: Package only explicit public assets
        run: |
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';let m=JSON.parse(fs.readFileSync('browser-emulator/offline-assets.json'));for(let f of [...m.files.filter(f=>f!=='./'),'sw.js','offline-assets.json','source.zip']){let out=path.join('work/b1-public/browser-emulator',f);fs.mkdirSync(path.dirname(out),{recursive:true});fs.copyFileSync(path.join('browser-emulator',f),out);}"
      - uses: actions/upload-artifact@v4
        with:
          name: Emulator-Browser-B1-public-assets
          path: work/b1-public
          if-no-files-found: error
